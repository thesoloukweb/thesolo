# thesolo.co.uk
#
# The site is a static build plus one endpoint. Everything here is a
# translation of vercel.json: the same redirects with the same status codes,
# the same security headers, and the same cache lifetimes, so that moving off
# Vercel does not quietly change what a browser or a crawler sees.
#
#   /etc/nginx/sites-available/thesolo.conf
#   include snippet: /etc/nginx/snippets/thesolo-headers.conf

server {
    listen 80;
    listen [::]:80;
    server_name thesolo.co.uk www.thesolo.co.uk;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.thesolo.co.uk$request_uri; }
}

# The apex answers on its own certificate and sends everyone to www, which is
# the host the canonical tags, sitemap and Search Console all use.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thesolo.co.uk;

    ssl_certificate     /etc/letsencrypt/live/thesolo.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thesolo.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 307 https://www.thesolo.co.uk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thesolo.co.uk;

    root /var/www/thesolo/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/thesolo.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thesolo.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 26MB of film and 14MB of menus live here; let the kernel do the copying.
    sendfile on;
    tcp_nopush on;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml application/manifest+json;

    access_log /var/log/nginx/thesolo.access.log;
    error_log  /var/log/nginx/thesolo.error.log;

    # ---- redirects, before anything else can normalise the path -------------
    # /menu was folded into the home page; /az has never been a page here but
    # visitors keep arriving on it, so it goes home rather than to a 404.
    location = /menu   { return 301 "/#menus"; }
    location = /menu/  { return 301 "/#menus"; }
    location = /az     { return 307 "/"; }
    location ^~ /az/   { return 307 "/"; }

    # ---- the mail endpoint --------------------------------------------------
    location ^~ /api/ {
        include /etc/nginx/snippets/thesolo-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- fingerprinted and long-lived assets --------------------------------
    location ^~ /_astro/ {
        include /etc/nginx/snippets/thesolo-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        include /etc/nginx/snippets/thesolo-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }
    location ^~ /images/ {
        include /etc/nginx/snippets/thesolo-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }
    location ^~ /video/ {
        include /etc/nginx/snippets/thesolo-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }
    location ^~ /pdfs/ {
        include /etc/nginx/snippets/thesolo-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ---- pages --------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/thesolo-headers.conf;

        # One URL per page. The build emits directories, so /about answers at
        # /about/ and the unslashed form is a redirect rather than a second
        # copy competing with it. Paths carrying a dot are files, not pages.
        if ($uri ~ ^/([^.]*[^/])$) {
            return 308 /$1/;
        }

        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/thesolo-headers.conf;
        internal;
    }
}
